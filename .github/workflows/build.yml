name: Build ROS QII Tester IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Tester Project
        run: |
          unzip -o ROS_QII_TESTER_V1.zip -d extracted

          test -f extracted/ROS_QII_TESTER_V1/project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: extracted/ROS_QII_TESTER_V1
        run: |
          xcodegen generate --spec project.yml

      - name: Build Unsigned IPA
        working-directory: extracted/ROS_QII_TESTER_V1
        run: |
          xcodebuild \
            -project ROSQiiTester.xcodeproj \
            -scheme ROSQiiTester \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: extracted/ROS_QII_TESTER_V1
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/ROSQiiTester.app \
            Payload/

          zip -qry ROS-QII-TESTER-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ROS-QII-TESTER-IPA
          path: extracted/ROS_QII_TESTER_V1/ROS-QII-TESTER-unsigned.ipa
          if-no-files-found: error
